{% if is_tester %}<div class="tester-buttons">
{% for action in ('next','reset') %}<form action="/test-mode" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="action" value="{{action}}"><button>{{ ('Next day' if action=='next' else 'Reset') if lang=='en' else ('اگلا دن' if action=='next' else 'اصل تاریخ') }}</button></form>{% endfor %}
</div>{% endif %}
