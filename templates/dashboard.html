{% extends 'base.html' %}{% block content %}
{% if is_tester %}<form class="tester-toggle" action="/test-mode" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><input type="hidden" name="day" value="{{ 'real' if test_mode else 'on' }}"><button>{{ ('Turn off test mode' if test_mode else 'Test mode') if lang=='en' else ('آزمائشی موڈ بند کریں' if test_mode else 'آزمائشی موڈ') }}</button></form>
{% if test_mode %}
<form class="tester-picker" action="/test-mode" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label for="tester-day">{{ 'Preview trial day' if lang=='en' else 'آزمائشی دن منتخب کریں' }}</label><select id="tester-day" name="day"><option value="real">{{'Real date' if lang=='en' else 'اصل تاریخ'}}</option>{% for n in range(8) %}<option value="{{n}}" {% if n==tester_day %}selected{% endif %}>{{ 'Day' if lang=='en' else 'دن' }} {{n}}</option>{% endfor %}</select><button>{{'Apply' if lang=='en' else 'لاگو کریں'}}</button></form>{% endif %}{% endif %}
<h1>{{ t.dashboard }}</h1><p>{{ t.welcome }}, {{ user.name }}.</p><section class="trial"><strong class="count">{{ days }}</strong><h2>{{ t.days }}</h2><p>{{ t.ends }}<br><bdi>{{ end }}</bdi></p>{% if not days %}<p>{{ t.expired }}</p>{% endif %}</section><p>{{ t.price }}</p><form action="/logout" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>{{ t.logout }}</button></form>{% endblock %}
