name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: 2.25.6.85
      VPS_PORT: "2222"
      VPS_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Copy code
        run: |
          rsync -az \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.staging' \
            --exclude '.env.prod' \
            --exclude 'instance/' \
            --exclude 'node_modules/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude 'secrets/rakhza.env' \
            --exclude 'secrets/.vault-password' \
            --exclude '*.db' \
            --exclude '*.log' \
            -e "ssh -p $VPS_PORT -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519" \
            ./ "$VPS_USER@$VPS_HOST:/opt/rakhza/"
      - name: Rebuild production
        run: |
          ssh -p "$VPS_PORT" -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 \
            "$VPS_USER@$VPS_HOST" "bash /opt/rakhza/deploy/update.sh production"
